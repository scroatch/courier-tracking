spring:
  application:
    name: courier-tracking
  datasource:
    url: jdbc:h2:file:./data/courier-tracking
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
courier:
  stores-file: classpath:stores.json
  distance:
    strategy: KARNEY_WGS84
  entrance:
    radius-meters: 100
    reentry-interval: 60s